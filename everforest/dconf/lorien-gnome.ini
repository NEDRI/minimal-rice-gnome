# Lorien Everforest for GNOME 50/51: the settings of the finished desktop.
# Loaded with `dconf load / < lorien-gnome.ini` by everforest/install.sh; @HOME@ becomes your home directory.

[org/gnome/desktop/interface]
accent-color='green'
clock-format='12h'
color-scheme='prefer-dark'
cursor-blink=true
cursor-blink-time=1000
cursor-size=24
cursor-theme='Bibata-Modern-Ice'
document-font-name='JetBrainsMono Nerd Font 10'
enable-animations=true
enable-hot-corners=true
font-name='JetBrainsMono Nerd Font 10'
gtk-theme='Everforest-Green-Dark'
icon-theme='Colloid-Green-Everforest-Dark'
monospace-font-name='JetBrainsMono Nerd Font Mono 10'
show-battery-percentage=true
toolbar-style='text'

[org/gnome/desktop/wm/keybindings]
close=['<Super>q', '<Alt>F4']
minimize=@as []
show-desktop=@as []
toggle-fullscreen=@as []
toggle-maximized=['<Super>f']

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
titlebar-font='JetBrainsMono Nerd Font Bold 10'

[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file://@HOME@/Pictures/Wallpapers/everforest/japanese_street_shop.png'
picture-uri-dark='file://@HOME@/Pictures/Wallpapers/everforest/japanese_street_shop.png'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file://@HOME@/Pictures/Wallpapers/everforest/japanese_street_shop.png'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/app-folders]
folder-children=['Internet', 'Programowanie', 'Elektronika', 'Biuro', 'Multimedia', 'Gry', 'System', 'Ustawienia', 'Narzedzia']

[org/gnome/desktop/app-folders/folders/Biuro]
apps=['org.libreoffice.LibreOffice.desktop', 'org.libreoffice.LibreOffice.writer.desktop', 'org.libreoffice.LibreOffice.calc.desktop', 'org.libreoffice.LibreOffice.impress.desktop', 'org.libreoffice.LibreOffice.draw.desktop', 'org.libreoffice.LibreOffice.math.desktop', 'org.libreoffice.LibreOffice.base.desktop', 'org.gnome.Papers.desktop', 'org.gnome.Calendar.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.SimpleScan.desktop', 'hp-uiscan.desktop', 'hplip.desktop']
