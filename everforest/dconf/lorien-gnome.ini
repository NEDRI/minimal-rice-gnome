[org/gnome/shell]
app-picker-layout=[{'org.gnome.Settings.desktop': <{'position': <0>}>, 'com.tuxedocomputers.tcc.desktop': <{'position': <1>}>, 'org.gnome.TextEditor.desktop': <{'position': <2>}>, 'Internet': <{'position': <3>}>, 'Programowanie': <{'position': <4>}>, 'Elektronika': <{'position': <5>}>, 'Biuro': <{'position': <6>}>, 'Multimedia': <{'position': <7>}>, 'Gry': <{'position': <8>}>, 'System': <{'position': <9>}>, 'Ustawienia': <{'position': <10>}>, 'Narzedzia': <{'position': <11>}>}]
disable-user-extensions=false
disabled-extensions=@as []
enabled-extensions=['user-theme@gnome-shell-extensions.gcampax.github.com', 'blur-my-shell@aunetx', 'dash-to-dock@micxgx.gmail.com', 'just-perfection-desktop@just-perfection', 'system-monitor@gnome-shell-extensions.gcampax.github.com', 'weatheroclock@CleoMenezesJr.github.io', 'desktop-widgets@r3nhick', 'isle@zickrian.github.io', 'appindicatorsupport@rgcjonas.gmail.com', 'kiwimenu@kemma', 'dynamic-music-pill@andbal', 'osd-volume-number@deminder', 'color-picker@tuberry', 'lorien-float@lorien-rice']
favorite-apps=['firefox.desktop', 'com.microsoft.VSCode.desktop', 'com.mitchellh.ghostty.desktop', 'dev.vencord.Vesktop.desktop', 'tidal-hifi.desktop', 'com.anthropic.Claude.desktop', 'org.gnome.Nautilus.desktop']

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=false
brightness=0.34999999999999998
sigma=40
static-blur=true

[org/gnome/shell/extensions/color-picker]
enable-systray=false

[org/gnome/shell/extensions/dash-to-dock]
always-center-icons=false
apply-custom-theme=false
autohide=true
autohide-in-fullscreen=true
background-color='#1e2326'
background-opacity=0.59999999999999998
custom-background-color=true
custom-theme-customize-running-dots=true
custom-theme-running-dots-border-width=0
custom-theme-running-dots-color='#a7c080'
custom-theme-shrink=true
dash-max-icon-size=40
dock-fixed=true
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
intellihide=true
intellihide-mode='ALL_WINDOWS'
running-indicator-style='SOLID'
shortcut=@as []
shortcut-text=''
show-apps-at-top=false
show-mounts=false
show-show-apps-button=true
show-trash=false
transparency-mode='DYNAMIC'

[org/gnome/shell/extensions/desktop-widgets-r3nhick]
show-panel-icon=false

[org/gnome/shell/extensions/isle]
agent-alerts-claude=true
app-usage=true
compact-top-bar=true
island-in-top-bar=true
island-monitor='active'
island-theme='glass'
notch-depth=24
top-bar-opacity=0
top-bar-style='glass'
track-peek=true

[org/gnome/shell/extensions/just-perfection]
activities-button=false
startup-status=0
workspace-popup=false

[org/gnome/shell/extensions/system-monitor]
show-download=true
show-swap=true
show-upload=true

[org/gnome/shell/extensions/user-theme]
name='Everforest-Green-Dark'

[org/gnome/shell/keybindings]
show-screenshot-ui=['Print', '<Super><Shift>s']
toggle-application-view=['<Super>a', '<Super>d']

[org/gnome/mutter]
center-new-windows=true
dynamic-workspaces=true
edge-tiling=true

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/terminal/']
home=['<Super>e']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/terminal]
binding='<Super>Return'
command='ghostty'
name='Terminal'
